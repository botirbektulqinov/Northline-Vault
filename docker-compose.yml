services:
  db:
    image: postgres:16-alpine
    container_name: northline-vault-db
    environment:
      POSTGRES_USER: northline
      POSTGRES_PASSWORD: northline_password
      POSTGRES_DB: northline_vault
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northline -d northline_vault"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - northline_vault_postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northline-vault
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://northline:northline_password@db:5432/northline_vault?schema=public
      DIRECT_URL: postgresql://northline:northline_password@db:5432/northline_vault?schema=public
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  northline_vault_postgres:
